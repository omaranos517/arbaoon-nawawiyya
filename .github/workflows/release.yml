name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync production branch to this tag
        run: git push origin ${{ github.sha }}:refs/heads/production
